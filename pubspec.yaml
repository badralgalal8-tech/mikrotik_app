# mikrotik_app
name: mikrotik_manager
description: "A Flutter application to manage MikroTik router and print thermal vouchers."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  routeros_api: ^1.0.4          # حزمة الاتصال بالميكروتك عبر الـ API
  blue_thermal_printer: ^1.2.5  # حزمة الطابعة الحرارية عبر البلوتوث
  permission_handler: ^11.0.0   # لصلاحيات البلوتوث والموقع

flutter:
  uses-material-design: true
